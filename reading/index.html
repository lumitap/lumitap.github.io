<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17183A">
<meta name="robots" content="noindex">
<title>English Reading Room</title>
<meta property="og:title" content="English Reading Room">
<meta property="og:description" content="Let's read together · Gayane Torosyan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,700;1,7..72,500&family=Inter:wght@500;600;700&family=Noto+Sans+Armenian:wght@500;600&display=swap">
<style>
/* One calm night-library card: the open-book logo breathing in gold light, letters drifting like dust in a reading lamp, one clear way in. */
:root{
  --navy:#17183A; --deep:#0E0B1D; --violet:#6A49E2; --lav:#A891F7; --gold:#F2C86B; --gold2:#E9C46A;
  --ink:#F6F3FF; --soft:#C9C2E3; --muted:#8B7CC7;
  --serif:"Literata",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --hy:"Noto Sans Armenian","Inter",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--sans);overflow-x:hidden;background-color:var(--deep);
  background:radial-gradient(90% 60% at 50% 22%,#2A1E4D 0%,var(--navy) 48%,var(--deep) 100%);
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:center;min-height:100svh;
}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.card{position:relative;z-index:1;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center}

.logoWrap{position:relative;width:min(168px,44vw);aspect-ratio:1;margin:4px 0 26px;opacity:0;transform:translateY(16px) scale(.92);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards}
.logoWrap::before{content:"";position:absolute;inset:-38%;border-radius:50%;background:radial-gradient(closest-side,rgba(242,200,107,.30),rgba(168,145,247,.14) 55%,transparent 75%);filter:blur(4px);animation:glow 5s ease-in-out infinite}
.logoWrap svg{position:relative;width:100%;height:100%;display:block;filter:drop-shadow(0 18px 40px rgba(10,6,30,.55));animation:float 6s ease-in-out infinite 1.3s}
.logoWrap svg .st{transform-origin:256px 470px;animation:leaf 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.5s + var(--i) * .14s)}

.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);opacity:0;animation:fade .8s .75s forwards}
h1{margin:14px 0 0;font:700 clamp(34px,10vw,44px)/1.04 var(--serif);letter-spacing:-.01em;opacity:0;animation:fade 1s .9s forwards}
h1 span{display:block;font-style:italic;font-weight:500;color:var(--lav)}
.motto{margin:16px 0 0;font:italic 500 19px/1.4 var(--serif);color:var(--soft);opacity:0;animation:fade 1s 1.1s forwards}
.motto::before,.motto::after{content:"";display:inline-block;width:22px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));vertical-align:middle;margin:0 10px}
.motto::after{background:linear-gradient(90deg,var(--gold),transparent)}
.hy{margin:10px 0 0;font:500 14.5px/1.55 var(--hy);color:var(--muted);opacity:0;animation:fade 1s 1.25s forwards}

.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px 0 0;padding:0;list-style:none}
.chips li{font:600 13px/1 var(--sans);color:var(--ink);padding:10px 14px;border-radius:999px;background:rgba(168,145,247,.10);border:1px solid rgba(168,145,247,.22);opacity:0;transform:translateY(8px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.chips li:nth-child(1){animation-delay:1.4s}.chips li:nth-child(2){animation-delay:1.5s}.chips li:nth-child(3){animation-delay:1.6s}.chips li:nth-child(4){animation-delay:1.7s}
.chips b{color:var(--gold);font-weight:700;margin-right:6px}

.cta{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:19px 22px;border-radius:20px;text-decoration:none;color:#fff;font:700 17px/1 var(--sans);letter-spacing:.01em;
  background:linear-gradient(135deg,#7A4FD6 0%,var(--violet) 45%,#B23F78 100%);
  box-shadow:0 14px 34px rgba(106,73,226,.45),inset 0 1px 0 rgba(255,255,255,.25);
  opacity:0;transform:translateY(10px);animation:rise .8s cubic-bezier(.2,.8,.2,1) .2s forwards;transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.6s ease-in-out 1.2s infinite}
.cta svg{width:24px;height:24px;flex:none}
.handle{margin-top:12px;font:500 13px/1 var(--sans);color:var(--muted);opacity:0;animation:fade .8s 2.1s forwards}
.handle a{color:var(--soft);text-decoration:none}

.foot{margin-top:34px;font:600 10px/1 var(--sans);letter-spacing:.32em;color:rgba(201,194,227,.38);opacity:0;animation:fade 1s 2.4s forwards}

@keyframes rise{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes leaf{from{opacity:0;transform:rotate(-8deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<main class="card">
  <a class="cta" href="https://www.instagram.com/english.readingroom/" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
    Follow on Instagram
  </a>
</main>
<script>
// Drifting letters and gold motes, like dust in the light of a reading lamp
(function(){
  var c=document.getElementById('dust'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),W,H,P=[];
  var L='AaBbCcDdEeFfGgHhRrSsTtWwYy'.split('');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  function make(init){var letter=Math.random()<.42;return{x:Math.random()*W,y:init?Math.random()*H:H+20,v:.12+Math.random()*.32,dx:(Math.random()-.5)*.18,
    s:letter?13+Math.random()*16:1+Math.random()*1.8,a:letter?.05+Math.random()*.10:.25+Math.random()*.45,ch:letter?L[Math.random()*L.length|0]:null,r:(Math.random()-.5)*.6,ph:Math.random()*6.28}}
  function init(){P=[];var n=Math.round(Math.min(70,W*H/9000));for(var i=0;i<n;i++)P.push(make(true))}
  function draw(t){x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var p=P[i];p.y-=p.v;p.x+=p.dx+Math.sin(t/2400+p.ph)*.12;if(p.y<-30){P[i]=make(false);continue}
      var tw=.65+.35*Math.sin(t/900+p.ph);
      if(p.ch){x.save();x.translate(p.x,p.y);x.rotate(p.r);x.font='italic 500 '+p.s+'px Literata, Georgia, serif';x.fillStyle='rgba(201,194,227,'+(p.a*tw)+')';x.fillText(p.ch,0,0);x.restore()}
      else{x.beginPath();x.arc(p.x,p.y,p.s,0,6.283);x.fillStyle='rgba(242,200,107,'+(p.a*tw)+')';x.shadowColor='rgba(242,200,107,.8)';x.shadowBlur=8;x.fill();x.shadowBlur=0}}
    if(!reduce)requestAnimationFrame(draw)}
  size();init();requestAnimationFrame(draw);
  addEventListener('resize',function(){size();init()});
})();
</script>
</body>
</html>
