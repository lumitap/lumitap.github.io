<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="robots" content="noindex">
<title>LumiTap</title>
<script>
// start the lookup immediately, before anything renders
(function () {
  var id = (location.search.match(/\d+/) || location.hash.match(/\d+/) || [""])[0];
  if (!id) return;
  fetch("/tags.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (all) {
      try { if (all._notify && navigator.sendBeacon) navigator.sendBeacon(all._notify, new Blob([JSON.stringify({ id: id })], { type: "text/plain" })); } catch (e) {}
      var tag = all[id];
      if (tag && tag.url) {
        var u = new URL(tag.url);
        if (u.host === location.host) u.searchParams.set("v", Date.now());
        location.replace(u.href);
      } else { window.__lt = "free"; render(); }
    })
    .catch(function () { window.__lt = "err"; render(); });
  window.render = function () {
    var b = document.getElementById("box"); if (!b) return;
    b.classList.add("idle");
    if (window.__lt === "free") { document.getElementById("h").textContent = "Տեգ № " + id; document.getElementById("p").textContent = "Այս տեգը դեռ կարգավորված չէ։"; }
    else { document.getElementById("h").textContent = "Չստացվեց բացել"; document.getElementById("p").textContent = "Ստուգեք ինտերնետը ու նորից մոտեցրեք հեռախոսը։"; }
  };
})();
</script>
<style>
:root{--bg:#0d0f14;--fg:#eef1f6;--soft:#8b93a5;--a:#7ce7d4;--b:#8aa8ff;--f:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;font-family:var(--f);color:var(--fg);background:var(--bg);text-align:center;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.box{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:300px;opacity:0;animation:in .25s .35s forwards}
@keyframes in{to{opacity:1}}
.ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(from 0deg,var(--a),var(--b),transparent 70%,var(--a));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:19px;font-weight:700}
p{margin:0;color:var(--soft);font-size:14px;line-height:1.5}
.brand{font-size:11px;letter-spacing:.3em;color:var(--soft)}
.idle{animation:none;opacity:1}
.idle .ring{display:none}
@media (prefers-reduced-motion:reduce){.box{animation:none;opacity:1}.ring{animation-duration:2.5s}}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="ring" aria-hidden="true"></div>
  <h1 id="h">Բացում եմ…</h1>
  <p id="p"></p>
  <div class="brand">LUMITAP</div>
</div>
</body>
</html>
