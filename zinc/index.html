<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="robots" content="noindex">
<title>Վճարում</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;800;900&display=swap">
<style>
/* Layout: a fake "bank charge" screen that turns into a confetti PRANK reveal. */
:root{--bg:#0b0e13;--card:#151a23;--fg:#eef2f8;--soft:#8b93a5;--line:#242c38;--red:#ff4d5e;--grn:#2ec77a;--f:"Noto Sans Armenian",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;font-family:var(--f);color:var(--fg);background:var(--bg);overflow:hidden;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center;position:relative;overflow:hidden}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--soft);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn)}
.amt{font-size:46px;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sub{color:var(--soft);font-size:14px;margin-top:4px}
.spin{width:52px;height:52px;margin:22px auto 6px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--red);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{min-height:22px;font-size:15px;color:var(--soft);margin-top:10px;transition:color .3s}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff8a3d);transition:width .2s}
.reveal{display:none}
.done .pay{display:none}
.done .reveal{display:block;animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.big{font-size:40px;font-weight:900;line-height:1.1;margin:6px 0}
.big .k{background:linear-gradient(100deg,#7ce7d4,#8aa8ff,#ffcf6a);-webkit-background-clip:text;background-clip:text;color:transparent}
.rsub{color:var(--soft);line-height:1.5;margin-top:10px;font-size:15px}
.again{margin-top:20px;display:inline-block;border:1px solid var(--line);color:var(--fg);background:#1d2531;border-radius:14px;padding:12px 20px;font:800 15px var(--f);cursor:pointer}
.again:active{transform:scale(.96)}
.emoji{font-size:64px;line-height:1}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="card" id="card">
  <div class="pay">
    <div class="brand"><span class="dot"></span> Secure Payment</div>
    <div class="amt">20.000 ֏</div>
    <div class="sub">Վճարում · **** 4417</div>
    <div class="spin" id="spin" aria-hidden="true"></div>
    <div class="status" id="st">Միանում ենք բանկին…</div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div class="reveal">
    <div class="emoji">😂</div>
    <div class="big">ԿԱՏԱ՜Կ ԷՐ<br><span class="k">հանգստացի՛ր</span></div>
    <div class="rsub">Ոչ մի փող չի քաշվել 💳✋<br>Քարտդ անձեռնմխելի է, բրատ 😄</div>
    <button class="again" id="again" type="button">Նորից վախեցնել 🔁</button>
  </div>
</div>
<script>
const card = document.getElementById("card"), st = document.getElementById("st"), bar = document.getElementById("bar");
const steps = [
  [600, "Միանում ենք բանկին…", 15],
  [900, "Ստուգում ենք քարտը…", 45],
  [800, "Հաստատում ենք վճարումը…", 80],
  [700, "Քաշվում է 20.000 ֏…", 100]
];
function run() {
  card.classList.remove("done"); bar.style.width = "0";
  let i = 0;
  (function next() {
    if (i >= steps.length) { setTimeout(reveal, 500); return; }
    const [d, text, pct] = steps[i++];
    st.textContent = text; if (i === steps.length) st.style.color = "var(--red)";
    bar.style.width = pct + "%";
    setTimeout(next, d);
  })();
}
function reveal() { card.classList.add("done"); boom(); }
document.getElementById("again").addEventListener("click", () => { st.style.color = ""; run(); });

// confetti
const c = document.getElementById("fx"), x = c.getContext("2d"), P = [];
const cols = ["#7ce7d4","#8aa8ff","#ffcf6a","#ff8fb8","#ffffff","#2ec77a"];
function size(){ const r = Math.min(devicePixelRatio||1,2); c.width=innerWidth*r; c.height=innerHeight*r; x.setTransform(r,0,0,r,0,0); }
addEventListener("resize", size); size();
let running = false;
function boom(){ if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cx = innerWidth/2, cy = innerHeight*.42;
  for (let i=0;i<150;i++){ const a=Math.random()*6.283, v=5+Math.random()*11;
    P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-7,r:3+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%6],life:0,sq:Math.random()<.6}); }
  if (!running){ running=true; requestAnimationFrame(tick); } }
function tick(){ x.clearRect(0,0,innerWidth,innerHeight);
  for (let i=P.length-1;i>=0;i--){ const p=P[i]; p.vy+=.3; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
    if (p.y>innerHeight+40||p.life>280){ P.splice(i,1); continue; }
    x.save(); x.translate(p.x,p.y); x.rotate(p.rot); x.fillStyle=p.c; x.globalAlpha=Math.min(1,(280-p.life)/70);
    if (p.sq) x.fillRect(-p.r,-p.r*.5,p.r*2,p.r); else { x.beginPath(); x.arc(0,0,p.r*.7,0,7); x.fill(); } x.restore(); }
  if (P.length) requestAnimationFrame(tick); else running=false; }
run();
</script>
</body>
</html>
